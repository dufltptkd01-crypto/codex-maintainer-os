name: Codex Maintainer OS
description: Build a Codex-ready maintainer brief from open GitHub issues and pull requests.
inputs:
  repo:
    description: GitHub repository in owner/name form.
    required: true
  output:
    description: Markdown report path.
    required: false
    default: maintainer-os-report.md
  token:
    description: GitHub token for private repositories or higher rate limits.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    - run: corepack enable
      shell: bash
    - run: corepack prepare pnpm@10.33.2 --activate
      shell: bash
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.11"
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: bun run "${{ github.action_path }}/src/cli.ts" analyze --repo "${{ inputs.repo }}" --output "${{ inputs.output }}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
